name: Benchmarks

# Report-only performance check on the hot dispatch path (Mediarq.Benchmarks): runs BenchmarkDotNet in
# CI, publishes the full results as a build artifact, and comments on the PR when a benchmark drifts
# from the committed baseline. Never fails the build — GitHub-hosted runners are shared/noisy, so a hard
# regression gate here would produce false positives; this is a signal for review, not a merge blocker.

on:
  pull_request:
    branches: [ dev, main ]
    paths:
      - 'src/Mediarq.Core/**'
      - 'src/Mediarq/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:
    inputs:
      refresh-baseline:
        description: 'Also upload a refreshed baseline artifact (download and commit it yourself to benchmarks/Mediarq.Benchmarks/baseline/ to accept new numbers)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # `--job short` trades precision for a CI-sized runtime; treat these numbers as a trend signal,
      # not authoritative — see benchmarks/Mediarq.Benchmarks/baseline/README.md.
      - name: Run benchmarks
        run: dotnet run -c Release --project benchmarks/Mediarq.Benchmarks -- --filter '*' --job short --exporters json

      - name: Upload full benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/**
          if-no-files-found: warn

      - name: Compare Send dispatch against baseline
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'benchmarkdotnet'
          output-file-path: BenchmarkDotNet.Artifacts/results/SendBenchmarks-report-full-compressed.json
          external-data-json-path: benchmarks/Mediarq.Benchmarks/baseline/send-benchmarks.json
          fail-on-alert: false
          comment-on-alert: true
          alert-threshold: '150%'
          summary-always: false
          save-data-file: ${{ inputs.refresh-baseline == true }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare Publish dispatch against baseline
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'benchmarkdotnet'
          output-file-path: BenchmarkDotNet.Artifacts/results/PublishBenchmarks-report-full-compressed.json
          external-data-json-path: benchmarks/Mediarq.Benchmarks/baseline/publish-benchmarks.json
          fail-on-alert: false
          comment-on-alert: true
          alert-threshold: '150%'
          summary-always: false
          save-data-file: ${{ inputs.refresh-baseline == true }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload refreshed baseline (manual runs only)
        if: ${{ inputs.refresh-baseline == true }}
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-baseline
          path: benchmarks/Mediarq.Benchmarks/baseline/*.json
