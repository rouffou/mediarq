name: Benchmarks

# Report-only performance check on the hot dispatch path (Mediarq.Benchmarks): runs BenchmarkDotNet in
# CI, publishes the full results as a build artifact, and comments on the PR when a benchmark drifts
# from its historical trend. Never fails the build — GitHub-hosted runners are shared/noisy, so a hard
# regression gate here would produce false positives; this is a signal for review, not a merge blocker.
#
# History is kept in a `gh-pages` branch (benchmark-action/github-action-benchmark's own data format —
# not something to hand-edit), used purely as a data store here. It does NOT collide with the DocFX site:
# GitHub Pages is configured to deploy from GitHub Actions (see docs.yml), not from a branch, so this
# branch is just storage, never served.
#
# A push to dev/main advances that history; a pull_request only compares against it (read-only).

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'src/Mediarq.Core/**'
      - 'src/Mediarq/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches: [ dev, main ]
    paths:
      - 'src/Mediarq.Core/**'
      - 'src/Mediarq/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # `--job short` trades precision for a CI-sized runtime; treat these numbers as a trend signal,
      # not authoritative.
      - name: Run benchmarks
        run: dotnet run -c Release --project benchmarks/Mediarq.Benchmarks -- --filter '*' --job short --exporters json

      - name: Upload full benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/**
          if-no-files-found: warn

      # auto-push only on a push to dev/main: a PR run compares against history without writing to it,
      # so a PR's short-job, potentially-noisy numbers never become part of the trend.
      - name: Track Send dispatch history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Mediarq.Benchmarks - Send'
          tool: 'benchmarkdotnet'
          output-file-path: BenchmarkDotNet.Artifacts/results/SendBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          # save-data-file defaults to true, which commits (but doesn't push) to the local gh-pages
          # checkout -- harmless for a single step, but a second step in the same job then fails to
          # re-fetch gh-pages (its local ref has diverged from origin with nothing pushed to reconcile
          # it). On a PR run we only want to compare/report, never write, so this must be explicit.
          save-data-file: ${{ github.event_name == 'push' }}
          fail-on-alert: false
          comment-on-alert: true
          alert-threshold: '150%'

      - name: Track Publish dispatch history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Mediarq.Benchmarks - Publish'
          tool: 'benchmarkdotnet'
          output-file-path: BenchmarkDotNet.Artifacts/results/PublishBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          # save-data-file defaults to true, which commits (but doesn't push) to the local gh-pages
          # checkout -- harmless for a single step, but a second step in the same job then fails to
          # re-fetch gh-pages (its local ref has diverged from origin with nothing pushed to reconcile
          # it). On a PR run we only want to compare/report, never write, so this must be explicit.
          save-data-file: ${{ github.event_name == 'push' }}
          fail-on-alert: false
          comment-on-alert: true
          alert-threshold: '150%'
