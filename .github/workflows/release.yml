name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for NuGet trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack
        run: |
          # One pack for every packable project of the solution (IsPackable=false excludes tests, samples,
          # benchmarks and the source generator, which ships inside Mediarq.Core). A new package is picked
          # up automatically instead of being forgotten in a hard-coded list.
          dotnet pack Mediarq.sln --no-build -c Release -p:Version=${{ steps.version.outputs.version }} -o ./artifacts
          dotnet pack templates/Mediarq.Templates.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o ./artifacts

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
